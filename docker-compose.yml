# Optional: run PostgreSQL in Docker instead of a local installation.
#
#   docker compose up -d
#
# Then set DB_PORT=5433 and DB_PASSWORD=postgres in .env (port 5433 avoids clashing
# with a PostgreSQL already installed on the default port 5432).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
